<!-- Version switcher: a dropdown in the sidebar header, built from versions.json
     at the site root. Every published version of the book lives in its own
     folder on the gh-pages branch (latest release at the root, the development
     build under dev/, older releases under v<version>/). When the file is missing,
     as in a local preview, no dropdown is shown. Adapted from the bgms site. -->
<style>
.book-version { margin: 0.4em 0 0 0; position: relative; font-size: 0.85rem; }
.book-version > button {
  background: none; border: 1px solid var(--bayespurple); border-radius: 4px;
  color: var(--bayespurple); padding: 0.1em 0.6em; cursor: pointer; font: inherit;
}
.book-version > button::after { content: " \25BE"; }
.book-version ul {
  display: none; position: absolute; left: 0; z-index: 1000; min-width: 14em;
  margin: 0.2em 0 0 0; padding: 0.3em 0; list-style: none; background: white;
  border: 1px solid #ccc; border-radius: 4px; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}
.book-version.open ul { display: block; }
.book-version li a {
  display: flex; justify-content: space-between; gap: 1em; padding: 0.25em 0.8em;
  color: #222; text-decoration: none;
}
.book-version li a:hover { background: var(--quizgray); }
.book-version li a.active { font-weight: bold; }
.book-version .book-version-kind { color: #777; font-size: 0.8em; }
</style>
<script>
(function () {
  const header = document.querySelector("#quarto-sidebar .sidebar-header");
  if (!header) return;

  // Where this build's own root is: /computational-methods-book/, .../dev/, .../v0.1/
  const offset = document.querySelector('meta[name="quarto:offset"]');
  let buildBase;
  if (offset) {
    buildBase = new URL(offset.content, window.location.href).pathname;
  } else {
    const lib = document.querySelector('link[href*="site_libs/"]');
    if (!lib) return;
    buildBase = new URL(lib.getAttribute("href").split("site_libs/")[0], window.location.href).pathname;
  }
  const parentOf = (path) => path.replace(/[^/]+\/$/, "");

  const readJson = async (url) => {
    try {
      const response = await fetch(url, { cache: "no-cache" });
      return response.ok ? await response.json() : null;
    } catch (e) { return null; }
  };
  const exists = async (url) => {
    try { return (await fetch(url, { method: "HEAD" })).ok; } catch (e) { return false; }
  };

  const label = (entry) => entry.kind === "release" ? "Version " + entry.version : "Development version";

  const render = (siteRoot, entries, current) => {
    const pagePath = window.location.pathname.slice(buildBase.length);
    const box = document.createElement("div");
    box.className = "book-version";
    const button = document.createElement("button");
    button.type = "button";
    button.setAttribute("aria-haspopup", "true");
    button.setAttribute("aria-expanded", "false");
    button.title = "Switch to another version of the book";
    button.textContent = label(current);
    const menu = document.createElement("ul");
    entries.forEach(entry => {
      const li = document.createElement("li");
      const link = document.createElement("a");
      link.className = entry === current ? "active" : "";
      link.href = siteRoot + entry.dir;
      const name = document.createElement("span");
      name.textContent = label(entry);
      const kind = document.createElement("span");
      kind.className = "book-version-kind";
      kind.textContent = entry.kind === "release" ? "release" : "latest changes";
      link.append(name, kind);
      // Stay on the same page when that version has it; otherwise go to its welcome page.
      link.addEventListener("click", async (event) => {
        event.preventDefault();
        const home = siteRoot + entry.dir;
        if (!pagePath) { window.location.href = home; return; }
        const target = home + pagePath;
        window.location.href = (await exists(target)) ? target + window.location.hash : home;
      });
      li.appendChild(link);
      menu.appendChild(li);
    });
    const close = () => { box.classList.remove("open"); button.setAttribute("aria-expanded", "false"); };
    button.addEventListener("click", (event) => {
      event.stopPropagation();
      const open = box.classList.toggle("open");
      button.setAttribute("aria-expanded", open ? "true" : "false");
    });
    document.addEventListener("click", (event) => { if (!box.contains(event.target)) close(); });
    document.addEventListener("keydown", (event) => { if (event.key === "Escape") close(); });
    box.append(button, menu);
    header.appendChild(box);
  };

  (async function () {
    // versions.json lives at the site root; a build one folder down finds it one level up.
    let base = buildBase;
    let index = await readJson(base + "versions.json");
    if (!index) {
      const up = parentOf(buildBase);
      if (!up || up === buildBase) return;
      base = up;
      index = await readJson(base + "versions.json");
    }
    if (!index || typeof index.root !== "string" || !Array.isArray(index.versions)) return;
    const siteRoot = index.root;
    const entries = index.versions
      .filter(entry => typeof entry.path === "string" && entry.path.startsWith(siteRoot))
      .map(entry => ({ version: entry.version, kind: entry.kind, dir: entry.path.slice(siteRoot.length) }));
    if (entries.length === 0) return;
    const current = entries.find(entry => entry.dir === buildBase.slice(siteRoot.length));
    if (!current) return;
    render(siteRoot, entries, current);
  })();
})();
</script>
