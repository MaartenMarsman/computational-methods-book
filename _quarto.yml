project:
  type: book
  output-dir: _book
  execute-dir: project

book:
  title: "Stochastic Simulation for Bayesian Modeling in Psychology"
  subtitle: "An Introduction to Computational Methods"
  author: "Maarten Marsman and Lourens Waldorp"
  output-file: Stochastic-Simulation-for-Bayesian-Modeling
  downloads: [pdf]
  site-url: https://maartenmarsman.github.io/computational-methods-book/
  repo-url: https://github.com/MaartenMarsman/computational-methods-book
  repo-actions: [issue]
  search: true
  chapters:
    - index.qmd
    - part: "Foundations"
      chapters:
        - chapters/01-probability-and-simulation.qmd
        - chapters/02-bayesian-inference-recap.qmd
    - part: "Markov Chains"
      chapters:
        - chapters/03-markov-chains.qmd
    - references.qmd
    - news.qmd
  page-footer:
    left: "Stochastic Simulation for Bayesian Modeling in Psychology, Maarten Marsman and Lourens Waldorp."
    right: "Published with [Quarto](https://quarto.org)."

metadata-files: [_version.yml]   # version label and date on the PDF title page, written by tools/version-label.sh

bibliography: references.bib
csl: apa.csl

execute:
  freeze: auto      # results are cached in _freeze/ (committed), so GitHub can build the site without R
  echo: true
  warning: false
  message: false

filters:
  - style/bookbox.lua

format:
  html:
    theme: cosmo
    css: style/bayesrules.css
    include-after-body: style/version-switcher.html
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 3
    code-copy: true
    code-overflow: wrap
    highlight-style: tango
    fig-width: 6
    fig-height: 3.5
    fig-align: center
    df-print: default
  pdf:
    documentclass: report
    pdf-engine: xelatex
    include-in-header: style/bayesrules.sty
    number-sections: true
    toc: true
    toc-depth: 2
    highlight-style: tango
    fig-width: 6
    fig-height: 3.5
    geometry:
      - margin=1in
    colorlinks: true
    linkcolor: bayespurple
    citecolor: bayespurple
    urlcolor: bayespurple
