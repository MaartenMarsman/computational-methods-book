name: Publish website

on:
  push:
    branches: [main, development]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# Deployments edit the gh-pages branch, so they must not run at the same time.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository (with tags, for versions.json)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      # Quarto needs R (only base R and rmarkdown) to assemble the PDF book,
      # even though every chapter's results come from the committed _freeze/.
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install rmarkdown
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: rmarkdown

      - name: Version label for the PDF
        run: bash tools/version-label.sh

      # All code results come from the committed _freeze/; nothing is executed.
      - name: Render
        run: quarto render

      - name: Publish to gh-pages (main -> root, development -> dev/, tag -> v<version>/)
        run: bash tools/deploy.sh
